services:
  - type: web
    name: aria-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.1
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: OLLAMA_API_KEY
        sync: false
      - key: SUPABASE_DB_URI
        sync: false
